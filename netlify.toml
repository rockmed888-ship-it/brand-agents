[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/connect"
  to = "/connect.html"
  status = 200

[[redirects]]
  from = "/grok"
  to = "/connect.html"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200

[[redirects]]
  from = "/booked-out"
  to = "/booked-out.html"
  status = 200

[[redirects]]
  from = "/brain-connector"
  to = "/brain-connector.html"
  status = 200

[[redirects]]
  from = "/brain"
  to = "/brain-connector.html"
  status = 200

[[redirects]]
  from = "/dd"
  to = "/dd.html"
  status = 200

[[redirects]]
  from = "/jarvis"
  to = "/jarvis.html"
  status = 200

[[headers]]
  for = "/jarvis.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/jarvis"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/download/dd"
  to = "/dd.html"
  status = 200

[[redirects]]
  from = "/beedee"
  to = "/beedee.html"
  status = 200

[[redirects]]
  from = "/try"
  to = "/try.html"
  status = 200

[[headers]]
  for = "/downloads/brain-install.ps1"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "attachment; filename=\"brain-install.ps1\""

[[headers]]
  for = "/downloads/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/releases/DD.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"DD.apk\""

[[headers]]
  for = "/releases/BeeDee.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"BeeDee.apk\""

[[headers]]
  for = "/assets/body/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=86400"
